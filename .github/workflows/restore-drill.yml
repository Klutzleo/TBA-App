name: Restore drill

# A backup you have never restored is a hope. This downloads the newest nightly backup from R2, decrypts it, restores it into a throwaway
# PostgreSQL 17, and checks the data really came back. It runs on the 1st of every month and can be run by hand. A failed run emails the repo owner.

on:
  schedule:
    - cron: "43 11 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BUCKET: tba-backups
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      PGPASSWORD: drill
    steps:
      - name: Check the secrets are all set
        run: |
          for v in R2_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY BACKUP_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::the secret for $v is not set"; exit 1; fi
          done

      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Download the newest nightly backup
        run: |
          latest=$(aws s3 ls "s3://$BUCKET/daily/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep '\.dump\.enc$' | sort | tail -1)
          [ -n "$latest" ] || { echo "::error::there are no backups in the bucket"; exit 1; }
          echo "newest backup: $latest"
          aws s3 cp "s3://$BUCKET/daily/$latest" backup.dump.enc --endpoint-url "$R2_ENDPOINT"
          echo "$latest" > latest.txt

      - name: Decrypt it
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in backup.dump.enc -out backup.dump -pass env:BACKUP_PASSPHRASE

      - name: Restore it into a scratch database
        run: |
          pg_restore --version | grep -q "(PostgreSQL) 17" || { echo "::error::pg_restore is not version 17"; exit 1; }
          createdb -h localhost -U postgres restored
          pg_restore --no-owner --no-privileges --exit-on-error -h localhost -U postgres -d restored backup.dump
          echo "restored without errors"

      - name: Check the data really came back
        run: |
          q() { psql -h localhost -U postgres -d restored -tA -c "$1"; }
          tables=$(q "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'")
          users=$(q "select count(*) from users")
          campaigns=$(q "select count(*) from campaigns")
          characters=$(q "select count(*) from characters")
          messages=$(q "select count(*) from messages")
          echo "backup file: $(cat latest.txt)"
          echo "restored: $tables tables, $users users, $campaigns campaigns, $characters characters, $messages messages"
          [ "$tables" -ge 40 ] || { echo "::error::too few tables came back ($tables)"; exit 1; }
          [ "$users" -ge 1 ] || { echo "::error::no users came back"; exit 1; }
          [ "$campaigns" -ge 1 ] || { echo "::error::no campaigns came back"; exit 1; }
          [ "$characters" -ge 1 ] || { echo "::error::no characters came back"; exit 1; }
          echo "RESTORE DRILL PASSED"
