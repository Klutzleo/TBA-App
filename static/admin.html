<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - TBA</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <script src="/js/auth-helper.js"></script>
  <style>
    :root {
      --bg: #101219; --panel: #1c2130; --panel-2: #232838; --border: #333a52;
      --gold: #d4af37; --red: #f87171; --green: #34d399; --orange: #f97316;
      --text: #e7e9f0; --text-mut: #a2a7b8; --text-dim: #6a7086;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-size: 1.4rem; color: var(--gold); margin-bottom: 4px; }
    .sub { color: var(--text-mut); font-size: 0.9rem; margin-bottom: 18px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab { background: var(--panel); border: 1px solid var(--border); color: var(--text-mut);
           padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
    .tab.active { color: var(--gold); border-color: var(--gold); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size: 1.02rem; margin-bottom: 6px; word-break: break-word; }
    .meta { color: var(--text-mut); font-size: 0.85rem; margin-bottom: 3px; word-break: break-word; }
    .meta b { color: var(--text); }
    .quote { margin: 10px 0; padding: 8px 10px; background: var(--panel-2); border-left: 3px solid var(--border); border-radius: 4px;
             font-size: 0.86rem; white-space: pre-wrap; word-break: break-word; }
    .line { font-size: 0.82rem; padding: 2px 0; color: var(--text-mut); word-break: break-word; }
    .line b { color: var(--text); }
    .line.hit { background: rgba(248,113,113,.12); color: var(--text); border-radius: 3px; padding: 2px 4px; }
    .line.private { border-left: 3px solid var(--orange); padding-left: 6px; }
    textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
               border-radius: 6px; padding: 8px; font: inherit; font-size: 0.85rem; resize: vertical; margin-top: 8px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button.act { border-radius: 6px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
                 border: 1px solid var(--border); background: var(--panel-2); color: var(--text); }
    button.act.warn { border-color: rgba(249,115,22,.7); color: var(--orange); }
    button.act.good { border-color: rgba(52,211,153,.6); color: var(--green); }
    button.act:disabled { opacity: .5; cursor: default; }
    .pill { display: inline-block; font-size: 0.72rem; border-radius: 4px; padding: 1px 7px; margin-left: 6px; border: 1px solid var(--border); color: var(--text-mut); }
    .pill.open { color: var(--orange); border-color: var(--orange); }
    .pill.reviewing { color: var(--gold); border-color: var(--gold); }
    .empty, .msg { color: var(--text-mut); padding: 30px 0; text-align: center; }
    .msg.err { color: var(--red); }
    .evidence { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
    .note-warn { color: var(--orange); font-size: 0.8rem; margin-top: 6px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; background: var(--text-dim); }
    .dot.good { background: var(--green); } .dot.bad { background: var(--red); } .dot.running { background: var(--gold); } .dot.unknown { background: var(--orange); }
    input[type=text], select { width: 100%; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
                               border-radius: 6px; padding: 8px; font: inherit; font-size: 0.85rem; margin-top: 6px; }
    label.row { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; margin-top: 6px; }
    .pick { display: block; width: 100%; text-align: left; margin-top: 4px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Admin</h1>
  <p class="sub">Admin only. Reporter names are shown here and nowhere else. Opening a private conversation is logged.</p>
  <div class="tabs">
    <button class="tab active" data-view="active" data-kind="player">Player reports</button>
    <button class="tab" data-view="active" data-kind="bug">Bug reports</button>
    <button class="tab" data-view="done" data-kind="all">Closed</button>
    <button class="tab" data-view="message">Message</button>
    <button class="tab" data-view="security">Security</button>
    <button class="tab" data-view="status">Status</button>
    <button class="tab" data-view="audit">Audit log</button>
    <a class="tab" href="/admin-reports.html">Banner reports</a>
  </div>
  <div id="list"></div>
</div>

<script>
  // Everything user-controlled (names, notes, chat lines) is written with textContent, never innerHTML,
  // so hostile text in a report cannot run script in the admin's session.
  const list = document.getElementById('list');
  let view = 'active', kind = 'player';

  function el(tag, props = {}, ...children) {
    const e = document.createElement(tag);
    Object.entries(props).forEach(([k, v]) => { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e[k] = v; });
    children.forEach(c => c && e.appendChild(c));
    return e;
  }
  function meta(label, value) {
    const d = el('div', { class: 'meta' });
    d.appendChild(el('b', { text: label + ': ' }));
    d.appendChild(document.createTextNode(value == null ? '' : String(value)));
    return d;
  }
  function show(text, isErr) { list.replaceChildren(el('div', { class: 'msg' + (isErr ? ' err' : ''), text })); }
  // Server times are UTC. Some arrive with an offset already (GitHub, Postgres timestamptz), some without (plain UTC), so only add a Z when none is there.
  function when(iso) {
    if (!iso) return '';
    const d = new Date(/(Z|[+-]\d\d:?\d\d)$/.test(iso) ? iso : iso + 'Z');
    return isNaN(d) ? String(iso) : d.toLocaleString();
  }
  async function api(path, opts) {
    const r = await fetchWithAuth(path, opts);
    if (!r) return null;
    if (r.status === 403) { show('Not authorized. This page is for admins only.', true); return null; }
    if (!r.ok) { show('Something went wrong (' + r.status + ').', true); return null; }
    return r.json();
  }

  function chatLine(m, hitId) {
    const d = el('div', { class: 'line' + (m.id === hitId ? ' hit' : '') + (m.private ? ' private' : '') });
    d.appendChild(el('b', { text: (m.sender || m.from || '') + (m.private ? ' (whisper)' : '') + ': ' }));
    d.appendChild(document.createTextNode(m.text || ''));
    return d;
  }

  async function openConversation(r, box, btn) {
    btn.disabled = true;
    const data = await api('/api/admin/reports/' + encodeURIComponent(r.id) + '/conversation');
    if (!data) return;
    box.replaceChildren(
      el('div', { class: 'meta', text: 'Everything ' + data.reporter + ' and ' + data.reported + ' said in this campaign, plus whispers between the two of them. This view was logged.' }),
      ...data.messages.map(m => { const l = chatLine({ ...m, sender: (m.from === 'reporter' ? data.reporter : data.reported) }, null); return l; })
    );
    if (!data.messages.length) box.appendChild(el('div', { class: 'meta', text: 'No messages.' }));
  }

  async function setStatus(r, status, noteBox, card) {
    const body = { status, admin_note: noteBox.value };
    const out = await api('/api/admin/reports/' + encodeURIComponent(r.id), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (out) load();
  }

  async function renderReport(summary) {
    const r = await api('/api/admin/reports/' + encodeURIComponent(summary.id));
    if (!r) return null;
    const card = el('div', { class: 'card' });
    const head = el('h2', { text: r.kind === 'bug' ? 'Bug report' : r.reason_label });
    head.appendChild(el('span', { class: 'pill ' + r.status, text: r.status }));
    card.appendChild(head);
    card.appendChild(meta('Reported by', r.reporter));
    if (r.kind === 'player') {
      card.appendChild(meta('About', r.reported + (r.snapshot.reported_characters && r.snapshot.reported_characters.length ? ' (' + r.snapshot.reported_characters.join(', ') + ')' : '')));
      card.appendChild(meta('Campaign', r.campaign_name));
      if (r.other_reports_about_them) card.appendChild(meta('Other reports about them', r.other_reports_about_them));
    } else {
      card.appendChild(meta('Page', r.snapshot.page));
      card.appendChild(meta('Browser', r.snapshot.user_agent));
    }
    card.appendChild(meta('Sent', when(r.created_at)));
    if (r.note) card.appendChild(el('div', { class: 'quote', text: r.note }));
    if (r.snapshot.context && r.snapshot.context.length) {
      const ev = el('div', { class: 'evidence' });
      ev.appendChild(el('div', { class: 'meta', text: 'The reported message and the lines around it, as the reporter saw them:' }));
      r.snapshot.context.forEach(m => ev.appendChild(chatLine(m, r.snapshot.message && r.snapshot.message.id)));
      card.appendChild(ev);
    }
    const convo = el('div', { class: 'evidence' });
    convo.style.display = 'none';
    if (r.kind === 'player') {
      const openBtn = el('button', { class: 'act warn', text: 'Open full conversation (logged)' });
      openBtn.onclick = () => { convo.style.display = ''; openConversation(r, convo, openBtn); };
      card.appendChild(el('div', { class: 'actions' }, openBtn));
      card.appendChild(el('div', { class: 'note-warn', text: 'Shows their whispers to each other. Only use it for a real harassment question.' }));
      card.appendChild(convo);
      if (!r.reported_is_admin) {
        const acct = el('div', { class: 'actions' });
        if (r.reported_suspended) {
          acct.appendChild(el('span', { class: 'pill open', text: 'Account suspended' }));
          const un = el('button', { class: 'act good', text: 'Restore account' });
          un.onclick = async () => {
            if (!confirm('Let ' + r.reported + ' log in again?')) return;
            const out = await api('/api/admin/users/' + encodeURIComponent(r.reported_user_id) + '/unsuspend?report_id=' + encodeURIComponent(r.id), { method: 'POST' });
            if (out) load();
          };
          acct.appendChild(un);
        } else {
          const sus = el('button', { class: 'act warn', text: 'Suspend account' });
          sus.onclick = async () => {
            const reason = prompt('Why are you suspending ' + r.reported + '? (private, they never see it)');
            if (!reason || reason.trim().length < 3) return;
            if (!confirm('Suspend ' + r.reported + '? They are logged out of every campaign right now and cannot log in until you restore them. Nothing is deleted.')) return;
            const out = await api('/api/admin/users/' + encodeURIComponent(r.reported_user_id) + '/suspend?report_id=' + encodeURIComponent(r.id),
              { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason: reason.trim() }) });
            if (out) load();
          };
          acct.appendChild(sus);
          acct.appendChild(el('div', { class: 'note-warn', text: 'If they are in a running encounter, the turn order will wait on them until the Story Weaver removes them.' }));
        }
        card.appendChild(acct);
      }
    }
    const note = el('textarea', { rows: 2, maxLength: 2000, placeholder: 'Private note for your records' });
    note.value = r.admin_note || '';
    card.appendChild(note);
    const acts = el('div', { class: 'actions' });
    const closed = r.status === 'resolved' || r.status === 'dismissed';
    if (!closed) {
      if (r.status === 'open') { const b = el('button', { class: 'act', text: 'Mark reviewing' }); b.onclick = () => setStatus(r, 'reviewing', note, card); acts.appendChild(b); }
      const res = el('button', { class: 'act good', text: 'Resolved' }); res.onclick = () => setStatus(r, 'resolved', note, card); acts.appendChild(res);
      const dis = el('button', { class: 'act', text: 'Dismiss' }); dis.onclick = () => setStatus(r, 'dismissed', note, card); acts.appendChild(dis);
    } else {
      const re = el('button', { class: 'act', text: 'Reopen' }); re.onclick = () => setStatus(r, 'open', note, card); acts.appendChild(re);
    }
    const save = el('button', { class: 'act', text: 'Save note' }); save.onclick = () => setStatus(r, r.status, note, card); acts.appendChild(save);
    card.appendChild(acts);
    return card;
  }

  // ---- Message tab: send a bell, push and/or email to one player or a whole campaign
  async function renderMessageForm() {
    const target = { type: null, id: null, label: null };
    const card = el('div', { class: 'card' });
    card.appendChild(el('h2', { text: 'Message a player or a campaign' }));
    card.appendChild(el('div', { class: 'meta', text: 'Goes only to active accounts. A campaign means its current members. Every send is logged.' }));

    const search = el('input', { type: 'text', placeholder: 'Search a username or a campaign name (2+ letters)', maxLength: 50 });
    const results = el('div');
    const toLine = el('div', { class: 'meta', text: 'To: nobody chosen yet' });
    card.append(search, results, toLine);
    let timer = null;
    search.oninput = () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        if (search.value.trim().length < 2) { results.replaceChildren(); return; }
        const r = await fetchWithAuth('/api/admin/lookup?q=' + encodeURIComponent(search.value.trim()));
        if (!r || !r.ok) return;
        const d = await r.json();
        const row = (type, id, label) => {
          const b = el('button', { class: 'act pick', text: (type === 'user' ? 'Player: ' : 'Campaign: ') + label });
          b.onclick = () => { target.type = type; target.id = id; target.label = label; toLine.textContent = 'To: ' + (type === 'user' ? 'player ' : 'everyone in ') + label; results.replaceChildren(); };
          return b;
        };
        results.replaceChildren(...d.users.filter(u => u.active).map(u => row('user', u.id, u.username)), ...d.campaigns.map(c => row('campaign', c.id, c.name)));
      }, 250);
    };

    const tpl = el('select');
    tpl.appendChild(el('option', { value: '', text: 'Start from a template (optional)' }));
    const subject = el('input', { type: 'text', placeholder: 'Subject', maxLength: 100 });
    const body = el('textarea', { rows: 5, maxLength: 1000, placeholder: 'Message' });
    let templates = [];
    const tr = await fetchWithAuth('/api/admin/templates');
    if (tr && tr.ok) {
      templates = (await tr.json()).templates;
      templates.forEach(t => tpl.appendChild(el('option', { value: t.id, text: t.name })));
    }
    tpl.onchange = () => { const t = templates.find(x => x.id === tpl.value); if (t) { subject.value = t.subject; body.value = t.body; } };
    card.append(tpl, subject, body);

    const chans = {};
    const chanRow = el('div');
    [['bell', 'In-app bell', true], ['push', 'Push notification', false], ['email', 'Email', false]].forEach(([k, label, on]) => {
      const cb = el('input', { type: 'checkbox', checked: on });
      chans[k] = cb;
      const l = el('label', { class: 'row' }); l.appendChild(cb); l.appendChild(document.createTextNode(label));
      chanRow.appendChild(l);
    });
    card.appendChild(chanRow);

    const status = el('div', { class: 'meta' });
    const payload = (dry) => ({ target: target.type, target_id: target.id, subject: subject.value.trim(), body: body.value.trim(),
                                channels: Object.keys(chans).filter(k => chans[k].checked), dry_run: dry });
    const ready = () => {
      if (!target.id) { status.textContent = 'Choose who to message first.'; return false; }
      if (subject.value.trim().length < 3 || body.value.trim().length < 3) { status.textContent = 'Add a subject and a message.'; return false; }
      if (!Object.values(chans).some(c => c.checked)) { status.textContent = 'Pick at least one way to send it.'; return false; }
      return true;
    };
    const post = async (dry) => {
      const r = await fetchWithAuth('/api/admin/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload(dry)) });
      if (!r) return null;
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { status.textContent = typeof d.detail === 'string' ? d.detail : 'Could not send (' + r.status + ').'; return null; }
      return d;
    };
    const preview = el('button', { class: 'act', text: 'Preview recipients' });
    preview.onclick = async () => {
      if (!ready()) return;
      const d = await post(true);
      if (d) status.textContent = d.recipients + ' recipient(s): ' + d.usernames.join(', ') + (d.recipients > d.usernames.length ? ' ...' : '');
    };
    const send = el('button', { class: 'act good', text: 'Send' });
    send.onclick = async () => {
      if (!ready()) return;
      const pre = await post(true);
      if (!pre) return;
      if (!pre.recipients) { status.textContent = 'No one to send to.'; return; }
      if (!confirm('Send "' + subject.value.trim() + '" to ' + pre.recipients + ' person(s) by ' + payload(true).channels.join(' + ') + '?')) return;
      send.disabled = true;
      const d = await post(false);
      send.disabled = false;
      if (d) status.textContent = 'Sent to ' + d.recipients + ' person(s).';
    };
    const saveTpl = el('button', { class: 'act', text: 'Save as template' });
    saveTpl.onclick = async () => {
      if (subject.value.trim().length < 3 || body.value.trim().length < 3) { status.textContent = 'Write the subject and message first.'; return; }
      const name = prompt('Name this template:');
      if (!name || name.trim().length < 2) return;
      const r = await fetchWithAuth('/api/admin/templates', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.trim(), subject: subject.value.trim(), body: body.value.trim() }) });
      status.textContent = r && r.ok ? 'Template saved.' : 'Could not save the template.';
      if (r && r.ok) { const t = await (await fetchWithAuth('/api/admin/templates')).json(); templates = t.templates; tpl.replaceChildren(el('option', { value: '', text: 'Start from a template (optional)' }), ...templates.map(x => el('option', { value: x.id, text: x.name }))); }
    };
    card.appendChild(el('div', { class: 'actions' }, preview, send, saveTpl));
    card.appendChild(status);
    list.replaceChildren(card);
  }

  // ---- Security tab: counts, busiest sources, and the server-error feed
  async function renderSecurity() {
    show('Loading...');
    const hours = 24;
    const [sum, err] = await Promise.all([api('/api/admin/security/summary?hours=' + hours), api('/api/admin/security/errors?hours=72')]);
    if (!sum || !err) return;
    const names = { signup_blocked: 'Blocked signups', login_failed: 'Failed logins', login_suspended: 'Suspended logins', rate_limited: 'Rate-limit hits', server_error: 'Server errors' };
    const top = el('div', { class: 'card' });
    top.appendChild(el('h2', { text: 'Last ' + hours + ' hours' }));
    Object.keys(names).forEach(k => top.appendChild(meta(names[k], sum.counts[k] || 0)));
    const reasons = Object.entries(sum.signup_block_reasons || {});
    if (reasons.length) top.appendChild(meta('Signups blocked because', reasons.map(([r, n]) => r.replace(/_/g, ' ') + ' ' + n).join(', ')));
    if (sum.busiest_sources.length) {
      top.appendChild(el('div', { class: 'meta', text: 'Busiest sources (a short code, not an address). A high count from one code is worth a look:' }));
      sum.busiest_sources.forEach(b => top.appendChild(el('div', { class: 'line', text: b.source + '  ' + b.kind.replace(/_/g, ' ') + '  x' + b.count })));
    }

    const errs = el('div', { class: 'card' });
    errs.appendChild(el('h2', { text: 'Server errors (last 72 hours): ' + err.total }));
    if (!err.total) errs.appendChild(el('div', { class: 'meta', text: 'None. All quiet.' }));
    err.groups.forEach(g => {
      const d = el('div', { class: 'quote' });
      d.appendChild(el('b', { text: g.error + '  x' + g.count }));
      d.appendChild(document.createTextNode('\n' + (g.where || '') + '\n' + (g.path || '') + (g.message ? '\n' + g.message : '') + '\nlast: ' + when(g.last_at)));
      errs.appendChild(d);
    });

    const recent = el('div', { class: 'card' });
    recent.appendChild(el('h2', { text: 'Latest events' }));
    if (!sum.recent.length) recent.appendChild(el('div', { class: 'meta', text: 'Nothing yet.' }));
    sum.recent.forEach(e => recent.appendChild(el('div', { class: 'line',
      text: when(e.at) + '  ' + (names[e.kind] || e.kind) + '  ' + (e.path || '') + (e.detail && e.detail.reason ? '  (' + e.detail.reason.replace(/_/g, ' ') + ')' : '') + (e.source ? '  [' + e.source + ']' : '') })));
    list.replaceChildren(top, errs, recent);
  }

  // ---- Status tab: is everything running, and how is each campaign doing
  async function renderStatus() {
    show('Loading...');
    const d = await api('/api/admin/status');
    if (!d) return;
    const dotLine = (state, label, detail) => {
      const l = el('div', { class: 'line' });
      l.appendChild(el('span', { class: 'dot ' + state }));
      l.appendChild(el('b', { text: label + ': ' }));
      l.appendChild(document.createTextNode(detail));
      return l;
    };
    const sys = el('div', { class: 'card' });
    sys.appendChild(el('h2', { text: 'System' }));
    sys.appendChild(dotLine(d.database.ok ? 'good' : 'bad', 'Database', 'answering in ' + d.database.ping_ms + ' ms, ' + d.database.accounts + ' accounts (' + d.database.suspended_accounts + ' suspended)'));
    sys.appendChild(dotLine('good', 'Version', (d.version.commit || 'unknown') + (d.version.message ? ' - ' + d.version.message : '') + ' (up since ' + when(d.version.started_at) + ')'));
    sys.appendChild(dotLine('good', 'Email confirmation', d.database.unconfirmed_emails + ' new account(s) have not confirmed their email yet. Confirming is ' + (d.database.email_verification_required ? 'REQUIRED to create or join a campaign.' : 'asked for but not required (switch REQUIRE_VERIFIED_EMAIL is off).')));
    if (d.database.latest_migration) sys.appendChild(dotLine('good', 'Latest migration', d.database.latest_migration.file + ' on ' + when(d.database.latest_migration.at)));
    d.checks.forEach(c => sys.appendChild(dotLine(c.state, c.name, c.detail + (c.at ? ' (' + when(c.at) + ')' : ''))));
    const wd = d.watchdog || {};
    const started = Object.entries(wd.last_started || {}).map(([f, t]) => f.replace('.yml', '') + ' ' + when(t)).join(', ');
    sys.appendChild(wd.enabled
      ? dotLine(wd.last_error ? 'bad' : 'good', 'Backup watchdog', 'on' + (wd.last_check ? ', last checked ' + when(wd.last_check) : ', first check shortly after the server starts')
        + (started ? ', last started: ' + started : '') + (wd.last_error ? '. Problem: ' + wd.last_error : ''))
      : dotLine('bad', 'Backup watchdog', 'OFF. GitHub skips scheduled runs, so backups will not run on their own. Set GITHUB_DISPATCH_TOKEN in Railway.'));
    sys.appendChild(dotLine(d.config.email_configured ? 'good' : 'bad', 'Email', d.config.email_configured ? 'configured, sending from ' + d.config.from_email : 'NOT configured'));
    sys.appendChild(dotLine(d.config.human_check_on ? 'good' : 'bad', 'Signup human check', d.config.human_check_on ? 'on' : 'OFF'));
    sys.appendChild(dotLine(d.config.push_configured ? 'good' : 'unknown', 'Push notifications', d.config.push_configured ? 'configured' : 'not configured'));
    sys.appendChild(dotLine(d.config.moderation_email_set ? 'good' : 'unknown', 'Report emails', d.config.moderation_email_set ? 'go to the moderation inbox' : 'go to the admin account email'));

    const act = el('div', { class: 'card' });
    act.appendChild(el('h2', { text: 'Right now and the last 24 hours' }));
    act.appendChild(meta('Players online', d.online_now));
    act.appendChild(meta('Reports waiting', d.open_reports));
    act.appendChild(dotLine(d.last_24h.server_errors ? 'bad' : 'good', 'Server errors', d.last_24h.server_errors + (d.last_24h.last_server_error_at ? ' (last ' + when(d.last_24h.last_server_error_at) + ')' : '')));
    act.appendChild(meta('Failed logins', d.last_24h.failed_logins));
    act.appendChild(meta('Blocked signups', d.last_24h.blocked_signups));
    act.appendChild(meta('Rate-limit hits', d.last_24h.rate_limited));

    const camps = el('div', { class: 'card' });
    camps.appendChild(el('h2', { text: 'Campaigns' }));
    if (!d.campaigns.length) camps.appendChild(el('div', { class: 'meta', text: 'No active campaigns.' }));
    d.campaigns.forEach(c => {
      const row = el('div', { class: 'quote' });
      row.appendChild(el('b', { text: c.name }));
      const bits = [c.members + ' members', c.online_now + ' online', c.last_message_at ? 'last message ' + when(c.last_message_at) : 'no messages yet'];
      if (c.active_encounter) bits.push('fight in progress');
      if (c.pending_characters) bits.push(c.pending_characters + ' character(s) waiting for approval');
      if (c.open_reports) bits.push(c.open_reports + ' open report(s)');
      row.appendChild(document.createTextNode('\n' + bits.join(' | ')));
      camps.appendChild(row);
    });
    list.replaceChildren(sys, act, camps);
  }

  async function load() {
    if (view === 'status') return renderStatus();
    if (view === 'security') return renderSecurity();
    if (view === 'message') return renderMessageForm();
    show('Loading...');
    if (view === 'audit') {
      const data = await api('/api/admin/audit?limit=200');
      if (!data) return;
      if (!data.entries.length) return show('Nothing logged yet.');
      list.replaceChildren(...data.entries.map(e => {
        const c = el('div', { class: 'card' });
        c.appendChild(el('h2', { text: e.action.replace(/_/g, ' ') }));
        c.appendChild(meta('By', e.admin));
        c.appendChild(meta('At', when(e.at)));
        if (e.detail && Object.keys(e.detail).length) c.appendChild(meta('Detail', JSON.stringify(e.detail)));
        return c;
      }));
      return;
    }
    const qs = view === 'done' ? 'status=all&kind=all' : 'status=active&kind=' + kind;
    const data = await api('/api/admin/reports?' + qs);
    if (!data) return;
    const items = view === 'done' ? data.reports.filter(r => r.status === 'resolved' || r.status === 'dismissed') : data.reports;
    if (!items.length) return show(view === 'done' ? 'Nothing closed yet.' : 'Nothing waiting. All clear.');
    const cards = [];
    for (const s of items) { const c = await renderReport(s); if (c) cards.push(c); }
    list.replaceChildren(...cards);
  }

  document.querySelectorAll('.tab[data-view]').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    view = t.dataset.view; kind = t.dataset.kind || 'all';
    load();
  });

  if (requireAuth()) load();
</script>
</body>
</html>
